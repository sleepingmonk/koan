name: Koan
type: theme
description: 'Drupal theme with Storybook, using algorithmic layout.'
core_version_requirement: ^10 || ^11
base theme: false

libraries:
  - koan/global

regions:
  header: Header
  navigation: Navigation
  messaging: Messaging
  title: Title
  tabs: Tabs
  content: Content
  secondary_footer: Secondary Footer
  footer: Footer
  drawer: Drawer

components:
  namespaces:
    atoms: ./stories/Components/Atoms
    molecules: ./stories/Components/Molecules
    organisms: ./stories/Components/Organisms
